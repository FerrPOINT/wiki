name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # fmt + clippy + test via the shared fleet gate (services-base).
  backend:
    uses: FerrPOINT/services-base/.github/workflows/backend-gate.yml@main
    with:
      working-directory: backend
      checkout-path: wiki
      services-base-sibling: true

  openapi-check:
    uses: FerrPOINT/services-base/.github/workflows/openapi-gate.yml@main
    with:
      checkout-path: wiki
      bin: openapi-gen
      spec: openapi/openapi.json
      services-base-sibling: true

  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki/backend
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: wiki
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: wiki
      # Fleet shared crates live in a sibling services-base checkout
      # (backend/infra path dep: ../../../services-base/crates/sdlc-auth-core).
      - uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wiki/backend
      - name: Apply all SQLx migrations to clean DB
        run: cargo run -p migration -- up
        env:
          DATABASE_URL: postgres://wiki:test@localhost:5432/wiki
      - name: Verify SQLx migration status
        run: cargo run -p migration -- status
        env:
          DATABASE_URL: postgres://wiki:test@localhost:5432/wiki

  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki/backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: wiki
      # Fleet shared crates live in a sibling services-base checkout
      # (backend/infra path dep: ../../../services-base/crates/sdlc-auth-core).
      - uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wiki/backend
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --summary-only -- --test-threads=1 2>&1 | tee /tmp/cov.txt
      - name: Enforce coverage threshold (60%)
        run: |
          COV=$(grep '^TOTAL' /tmp/cov.txt | awk '{print $NF}' | tr -d '%')
          echo "Coverage: ${COV}%"
          if (( $(echo "$COV < 60" | bc -l) )); then
            echo "::error::Coverage ${COV}% is below 60% threshold"
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki/backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: wiki
      # Fleet shared crates live in a sibling services-base checkout
      # (backend/infra path dep: ../../../services-base/crates/sdlc-auth-core).
      - uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wiki/backend
      - uses: taiki-e/install-action@cargo-audit
      # SQLx keeps optional MySQL/RSA packages in Cargo.lock; Wiki enables only PostgreSQL.
      - run: cargo audit --ignore RUSTSEC-2023-0071

  # install + test + lint + build via the shared fleet gate.
  frontend:
    uses: FerrPOINT/services-base/.github/workflows/frontend-gate.yml@main
    with:
      working-directory: frontend
      checkout-path: wiki
      services-base-sibling: true
      pretest: "pnpm typecheck"
