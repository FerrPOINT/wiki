# Automatic: unit tests and changed application build; manual release.yml for integration/slow.
name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      frontend_build: ${{ steps.classify.outputs.frontend_build }}
      backend_build: ${{ steps.classify.outputs.backend_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: wiki
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch exact comparison commits
        working-directory: wiki
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          fi
      - name: Verify packaged Base selector
        run: |
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          root=Path('wiki')
          pin=(root/'.quality-tooling-revision').read_text().strip()
          receipt=json.loads((root/'scripts/vendor/base-quality-tooling.json').read_text())
          if not re.fullmatch(r'[0-9a-f]{40}',pin) or receipt['schema']!='base-quality-tooling/v1' or receipt['revision']!=pin:
              raise SystemExit('Packaged Base revision mismatch')
          if hashlib.sha256((root/'scripts/vendor/base_quality_selection.py').read_bytes()).hexdigest()!=receipt['sha256']:
              raise SystemExit('Packaged Base selector checksum mismatch')
          cache=receipt['rust_target_cache']
          assert cache['file']=='base_rust_target_cache.py'
          assert hashlib.sha256((root/'scripts/vendor'/cache['file']).read_bytes()).hexdigest()==cache['sha256']
          PY
      - name: Verify the frontend artifact CI contract
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('wiki')
          packet=json.loads((root/'scripts/vendor/base-quality-tooling.json').read_text())
          helper=packet['frontend_artifact']
          assert helper['file']=='base_frontend_artifact.py'
          assert hashlib.sha256((root/'scripts/vendor'/helper['file']).read_bytes()).hexdigest()==helper['sha256']
          PY
          python3 wiki/scripts/vendor/base_frontend_artifact.py check-ci --root wiki
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 wiki/scripts/vendor/base_quality_selection.py --root wiki
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: wiki
      - name: README validator tests
        working-directory: wiki
        run: python3 -m unittest scripts.tests.test_verify_readme scripts.tests.test_ci_contract_checks
      - name: README structural validation
        working-directory: wiki
        run: python3 scripts/verify_readme.py
  minimum-rust:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: wiki
      - name: Read pinned Base revision
        id: base
        working-directory: wiki
        run: |
          pin=.base-revision
          if [ -f .namespace-base-revision ]; then pin=.namespace-base-revision; fi
          echo "sha=$(cat "$pin")" >> "$GITHUB_OUTPUT"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: ${{ steps.base.outputs.sha }}
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - name: Verify pinned Base checkout
        working-directory: wiki
        run: python3 ../services-base/scripts/verify_base_revision.py --revision "${{ steps.base.outputs.pin }}" --base ../services-base
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wiki/backend
      - name: Reset restored local crates once; keep compiled external dependencies
        working-directory: wiki/backend
        run: python3 ../scripts/vendor/base_rust_target_cache.py
      - name: Check declared minimum independently of release builds
        working-directory: wiki/backend
        run: cargo check --locked --workspace --all-targets
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wiki/backend
    steps:
      - uses: actions/checkout@v7
        with:
          path: wiki
      - name: Read pinned Base revision
        id: base
        working-directory: wiki
        run: |
          pin=.base-revision
          if [ -f .namespace-base-revision ]; then pin=.namespace-base-revision; fi
          echo "sha=$(cat "$pin")" >> "$GITHUB_OUTPUT"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out services-base sibling (path deps)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          ref: ${{ steps.base.outputs.sha }}
      - name: Verify pinned Base checkout
        working-directory: wiki
        run: python3 ../services-base/scripts/verify_base_revision.py --revision "${{ steps.base.outputs.pin }}" --base ../services-base
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wiki/backend
      - name: Reset restored local crates once; keep compiled external dependencies
        working-directory: wiki/backend
        run: python3 ../scripts/vendor/base_rust_target_cache.py
      - name: Fast isolated domain units (no PostgreSQL)
        run: |-
          cargo fmt --all -- --check
          cargo test --locked -p domain --lib
      - name: Build changed application after isolated units
        if: needs.changes.outputs.backend_build == 'true'
        run: cargo build --locked --workspace
        env:
          SQLX_OFFLINE: "true"
      - name: OpenAPI drift gate
        run: |
          "${CARGO_TARGET_DIR:-target}/debug/openapi-gen" ../openapi/openapi.json.generated
          diff -u ../openapi/openapi.json ../openapi/openapi.json.generated
        if: needs.changes.outputs.backend_build == 'true'
    env:
      SQLX_OFFLINE: "true"
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    outputs:
      manifest_sha256: ${{ steps.frontend_artifact.outputs.manifest_sha256 }}
      checksums_sha256: ${{ steps.frontend_artifact.outputs.checksums_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wiki/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          path: wiki
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Read pinned Base revision
        id: base
        working-directory: wiki
        run: |
          pin=.base-ui-revision
          echo "sha=$(cat "$pin")" >> "$GITHUB_OUTPUT"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out services-base sibling (@sdlc/ui file dep)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          ref: ${{ steps.base.outputs.sha }}
      - name: Verify pinned Base checkout
        working-directory: wiki
        run: python3 ../services-base/scripts/verify_base_revision.py --revision "${{ steps.base.outputs.pin }}" --base ../services-base
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: wiki/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts=false
        env:
          CI: "true"
      - name: Verify postinstall-generated contract and lockfile
        run: |
          git ls-files --error-unmatch pnpm-lock.yaml src/api/generated.ts src/api/generated-exports.ts > /dev/null
          git diff --exit-code -- pnpm-lock.yaml src/api/generated.ts src/api/generated-exports.ts
      - name: Typecheck independently of application build
        run: pnpm exec tsc --noEmit
      - run: pnpm test:unit
      - run: pnpm lint
      - run: pnpm format:check
      - name: OpenAPI compatibility against target branch
        run: |
          git fetch origin main --depth=1
          pnpm openapi:compat
      - run: pnpm exec vite build
        if: needs.changes.outputs.frontend_build == 'true'
      - name: Verify exact frontend tooling packet
        if: needs.changes.outputs.frontend_build == 'true'
        working-directory: wiki
        run: |
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          root=Path('.')
          pin=(root/'.quality-tooling-revision').read_text().strip()
          packet=json.loads((root/'scripts/vendor/base-quality-tooling.json').read_text())
          assert re.fullmatch(r'[a-f0-9]{40}',pin) and packet['schema']=='base-quality-tooling/v1' and packet['revision']==pin
          helper=packet['frontend_artifact']; recipe=packet['frontend_recipe']
          assert helper['file']=='base_frontend_artifact.py' and recipe['file']=='frontend/Dockerfile.prebuilt'
          for name,expected in [('scripts/vendor/'+helper['file'],helper['sha256']), (recipe['file'],recipe['sha256']), (recipe['file']+'.dockerignore',recipe['ignore_sha256'])]:
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected,name
          PY
      - name: Seal the tested frontend dist
        id: frontend_artifact
        if: needs.changes.outputs.frontend_build == 'true'
        working-directory: wiki
        run: python3 scripts/vendor/base_frontend_artifact.py seal --root . --dist frontend/dist --artifact .local/frontend-artifact --node-version 22.20.0 --pnpm-version 10.28.1
      - name: Preserve the single tested frontend artifact
        if: needs.changes.outputs.frontend_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tested-frontend-dist
          path: wiki/.local/frontend-artifact
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  frontend-package:
    name: Package the tested frontend without recompilation
    needs: [changes, frontend]
    if: needs.changes.outputs.frontend_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: wiki
    env:
      EXPECTED_FRONTEND_MANIFEST_SHA256: ${{ needs.frontend.outputs.manifest_sha256 }}
      EXPECTED_FRONTEND_CHECKSUMS_SHA256: ${{ needs.frontend.outputs.checksums_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: wiki
          ref: ${{ github.sha }}
      - name: Receive the tested frontend packet
        uses: actions/download-artifact@v8
        with:
          name: tested-frontend-dist
          path: wiki/.local/frontend-artifact
      - name: Verify candidate and payload before packaging
        run: |
          python3 scripts/vendor/base_frontend_artifact.py verify --root . --artifact .local/frontend-artifact --manifest-sha256 "$EXPECTED_FRONTEND_MANIFEST_SHA256" --node-version 22.20.0 --pnpm-version 10.28.1 > .local/frontend-verified.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path('.local/frontend-verified.json').read_text())
          assert report['checksums_sha256']==os.environ['EXPECTED_FRONTEND_CHECKSUMS_SHA256']
          PY
      - name: Package the verified dist with the product nginx runtime
        run: |
          docker buildx build --load --iidfile .local/frontend-image.id \
          --build-context tested_frontend=.local/frontend-artifact \
          --build-arg FRONTEND_CHECKSUMS_SHA256="$EXPECTED_FRONTEND_CHECKSUMS_SHA256" \
          --build-arg SOURCE_REVISION="$(git rev-parse HEAD)" \
          --build-arg VITE_NAMESPACE_ENABLED="${VITE_NAMESPACE_ENABLED:-false}" \
          --file frontend/Dockerfile.prebuilt frontend
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          report=json.loads(Path('.local/frontend-verified.json').read_text())
          image=Path('.local/frontend-image.id').read_text().strip()
          assert re.fullmatch(r'sha256:[a-f0-9]{64}',image)
          report.update(image_id=image,application_recompiled=False)
          Path('.local/frontend-package.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Preserve the artifact and image identity
        uses: actions/upload-artifact@v7
        with:
          name: frontend-packaging-receipt
          path: wiki/.local/frontend-package.json
          if-no-files-found: error
          retention-days: 7
