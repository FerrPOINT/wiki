name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # fmt + clippy + test via the shared fleet gate (services-base).
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki/backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: wiki
      - name: Check out services-base sibling (path deps)
        uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wiki/backend
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --test-threads=1
  openapi-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki/backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: wiki
      - name: Check out services-base sibling (path deps)
        uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wiki/backend
      - name: Regenerate OpenAPI
        run: cargo run -p api --bin openapi-gen ../openapi/openapi.json.generated
      - name: Check committed spec matches code
        run: diff -u ../openapi/openapi.json ../openapi/openapi.json.generated
  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki/backend
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: wiki
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: wiki
      # Fleet shared crates live in a sibling services-base checkout
      # (backend/infra path dep: ../../../services-base/crates/sdlc-auth-core).
      - uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wiki/backend
      - name: Apply all SQLx migrations to clean DB
        run: cargo run -p migration -- up
        env:
          DATABASE_URL: postgres://wiki:test@localhost:5432/wiki
      - name: Verify SQLx migration status
        run: cargo run -p migration -- status
        env:
          DATABASE_URL: postgres://wiki:test@localhost:5432/wiki

  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki/backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: wiki
      # Fleet shared crates live in a sibling services-base checkout
      # (backend/infra path dep: ../../../services-base/crates/sdlc-auth-core).
      - uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wiki/backend
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --summary-only -- --test-threads=1 2>&1 | tee /tmp/cov.txt
      - name: Enforce coverage threshold (60%)
        run: |
          COV=$(grep '^TOTAL' /tmp/cov.txt | awk '{print $NF}' | tr -d '%')
          echo "Coverage: ${COV}%"
          if (( $(echo "$COV < 60" | bc -l) )); then
            echo "::error::Coverage ${COV}% is below 60% threshold"
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki/backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: wiki
      # Fleet shared crates live in a sibling services-base checkout
      # (backend/infra path dep: ../../../services-base/crates/sdlc-auth-core).
      - uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wiki/backend
      - uses: taiki-e/install-action@cargo-audit
      # SQLx keeps optional MySQL/RSA packages in Cargo.lock; Wiki enables only PostgreSQL.
      - run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0436

  # install + test + lint + build via the shared fleet gate.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          path: wiki
      - name: Check out services-base sibling (@sdlc/ui file dep)
        uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: wiki/frontend/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
        env:
          CI: "true"
      - run: pnpm openapi:check
      - run: pnpm test -- --run
      - run: pnpm lint
      - run: pnpm build

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: wiki
      - name: Check out services-base sibling (path deps)
        uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: wiki/backend/Cargo.toml
          arguments: --all-features

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: wiki/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          path: wiki
      - name: Check out services-base sibling (@sdlc/ui file dep)
        uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: wiki/frontend/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
        env:
          CI: "true"
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright against vite preview
        run: |
          pnpm exec vite preview --port 4174 --strictPort &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4174/ >/dev/null 2>&1 && break
            sleep 1
          done
          PLAYWRIGHT_BASE_URL=http://localhost:4174 pnpm exec playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wiki-playwright-traces
          path: wiki/frontend/test-results
          retention-days: 5

