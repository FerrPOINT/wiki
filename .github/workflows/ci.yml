name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: wiki
      - name: README validator tests
        working-directory: wiki
        run: python3 -m unittest scripts.tests.test_verify_readme scripts.tests.test_ci_contract_checks
      - name: README structural validation
        working-directory: wiki
        run: python3 scripts/verify_readme.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wiki
          POSTGRES_DB: wiki_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiki -d wiki_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: wiki/backend
    steps:
      - uses: actions/checkout@v7
        with:
          path: wiki
      - name: Read pinned Base revision
        id: base
        working-directory: wiki
        run: |
          pin=.base-revision
          if [ -f .namespace-base-revision ]; then pin=.namespace-base-revision; fi
          echo "sha=$(cat "$pin")" >> "$GITHUB_OUTPUT"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out services-base sibling (path deps)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          ref: ${{ steps.base.outputs.sha }}
      - name: Verify pinned Base checkout
        working-directory: wiki
        run: python3 ../services-base/scripts/verify_base_revision.py --revision "${{ steps.base.outputs.pin }}" --base ../services-base
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wiki/backend
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test with isolated PostgreSQL
        run: cargo test --locked --workspace -- --test-threads=1
        env:
          WIKI_TEST_DATABASE_URL: postgres://wiki@127.0.0.1:5432/wiki_test
      - name: Verified profile and central directory projection on isolated PostgreSQL
        run: cargo test --locked -p infra central_directory_tests -- --ignored --test-threads=1
        env:
          WIKI_TEST_DATABASE_URL: postgres://wiki@127.0.0.1:5432/wiki_test
      - name: OpenAPI drift gate
        run: |
          cargo run --locked -p api --bin openapi-gen ../openapi/openapi.json.generated
          diff -u ../openapi/openapi.json ../openapi/openapi.json.generated

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wiki/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          path: wiki
          fetch-depth: 0
      - name: Read pinned Base revision
        id: base
        working-directory: wiki
        run: |
          pin=.base-revision
          if [ -f .namespace-base-revision ]; then pin=.namespace-base-revision; fi
          echo "sha=$(cat "$pin")" >> "$GITHUB_OUTPUT"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out services-base sibling (@sdlc/ui file dep)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          ref: ${{ steps.base.outputs.sha }}
      - name: Verify pinned Base checkout
        working-directory: wiki
        run: python3 ../services-base/scripts/verify_base_revision.py --revision "${{ steps.base.outputs.pin }}" --base ../services-base
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          cache: pnpm
          cache-dependency-path: wiki/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        env:
          CI: "true"
      - run: pnpm openapi:check
      - run: pnpm test -- --run
      - run: pnpm lint
      - run: pnpm format:check
      - name: OpenAPI compatibility against target branch
        run: |
          git fetch origin main --depth=1
          pnpm openapi:compat
      - name: Generated contract and lockfile stay unchanged
        run: git diff --exit-code -- pnpm-lock.yaml src/api/generated.ts src/api/schema.d.ts
      - run: pnpm build
      - name: Packed Base consumer
        run: python ../../services-base/scripts/check_ui_consumer.py
      - name: Effective themes in the built consumer
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/theme-preview.log 2>&1 &
          pnpm theme:check http://127.0.0.1:4173

  minimum-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: wiki
      - name: Read pinned Base revision
        id: base
        working-directory: wiki
        run: |
          pin=.base-revision
          if [ -f .namespace-base-revision ]; then pin=.namespace-base-revision; fi
          echo "sha=$(cat "$pin")" >> "$GITHUB_OUTPUT"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: ${{ steps.base.outputs.sha }}
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - name: Verify pinned Base checkout
        working-directory: wiki
        run: python3 ../services-base/scripts/verify_base_revision.py --revision "${{ steps.base.outputs.pin }}" --base ../services-base
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wiki/backend
      - name: Check declared minimum independently of release builds
        working-directory: wiki/backend
        run: cargo check --locked --workspace --all-targets
