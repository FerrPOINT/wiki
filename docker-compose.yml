services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-[CHANGE_ME]}
      POSTGRES_DB: ${POSTGRES_DB:-wiki}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-3457}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wiki} -d ${POSTGRES_DB:-wiki}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.0-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      # config crate format: WIKI_ + SECTION__KEY (separator "__", prefix_separator "_")
      WIKI_DATABASE__URL: ${WIKI_DATABASE__URL}
      WIKI_SERVER__ADDRESS: 0.0.0.0
      WIKI_SERVER__PORT: 3456
      WIKI_JWT_SECRET: ${WIKI_JWT_SECRET:-[CHANGE_ME]}
      # Rate limits are configurable; defaults are production-safe (auth 5/15s, api 60/60s).
      WIKI_SERVER__AUTH_RATE_BURST: ${WIKI_SERVER__AUTH_RATE_BURST:-5}
      WIKI_SERVER__AUTH_RATE_PERIOD_SECS: ${WIKI_SERVER__AUTH_RATE_PERIOD_SECS:-15}
      WIKI_SERVER__GENERAL_RATE_BURST: ${WIKI_SERVER__GENERAL_RATE_BURST:-60}
      WIKI_SERVER__GENERAL_RATE_PERIOD_SECS: ${WIKI_SERVER__GENERAL_RATE_PERIOD_SECS:-60}
      WIKI_STORAGE__DIR: ${WIKI_STORAGE__DIR:-/var/lib/wiki/uploads}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      # Attachment files must survive container recreation.
      - uploads:/var/lib/wiki/uploads
    ports:
      - "3456:3456"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3456/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "19877:80"
    depends_on:
      backend:
        condition: service_healthy

  traefik:
    image: traefik:v3.4
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8080:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    profiles:
      - traefik

volumes:
  postgres_data:
  redis_data:
  uploads:
